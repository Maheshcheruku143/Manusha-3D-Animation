<!DOCTYPE html>
<html>
<head>
<title>Mahesh Fun Hacker Screen</title>
<style>
body{
 background:black;
 color:#00ff00;
 font-family:monospace;
 text-align:center;
 padding-top:100px;
}
#text{
 font-size:25px;
}
</style>
</head>

<body>

<h1>💻 Mahesh Fun Mode 💻</h1>
<p id="text"></p>

 <img src="manusha.jpg.jpg" alt="Manusha Photo">
 
<script>
let msg="Connecting to Manusha's Fun World... Loading Friendship... 100% Complete ❤️";
let i=0;

function type(){
 if(i<msg.length){
  document.getElementById("text").innerHTML += msg.charAt(i);
  i++;
  setTimeout(type,50);
 }
}
type();
</script>

</body>
</html>
